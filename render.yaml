services:
  - type: web
    name: kingbot-platform
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /data/kingbot.sqlite
    disk:
      name: kingbot-data
      mountPath: /data
      sizeGB: 1
